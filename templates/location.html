{{define "content"}}
<a href="{{.P}}/b/{{.L.BusinessID}}" class="back">← {{.BusinessName}}</a>
<h1 class="mt-2 text-2xl font-bold">{{.L.Name}}</h1>
{{if .L.Address}}<p class="mt-1 text-zinc-500 dark:text-zinc-400">{{.L.Address}}</p>{{end}}

<h2 class="h2">Метки</h2>
<div class="space-y-3">
{{range .Tags}}
  <a href="{{$.P}}/g/{{.ID}}" class="card card-link group">
    <div class="min-w-0">
      <div class="flex flex-wrap items-center gap-2"><span class="font-mono text-zinc-400">{{printf "#%03d" .ID}}</span><span class="truncate font-semibold">{{.Name}}</span>{{if .Active}}<span class="badge-ok">● Активна</span>{{else}}<span class="badge-bad">Отключена</span>{{end}}</div>
      <p class="mt-1 text-sm text-zinc-500 dark:text-zinc-400">Переходов: {{.Clicks}}</p>
    </div>
    <span class="text-2xl text-zinc-400 group-hover:text-blue-500">›</span>
  </a>
{{else}}
  <p class="card text-zinc-500 dark:text-zinc-400">Меток пока нет.</p>
{{end}}
</div>
<details class="add">
  <summary>+ Добавить метку</summary>
  <form method="post" action="{{.P}}/l/{{.L.ID}}/tags" class="space-y-4 px-4 pb-4">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label class="label">Название<input class="input" name="name" placeholder="Касса" required></label>
    <label class="label">Куда перенаправлять<input class="input" type="url" name="url" placeholder="https://yandex.ru/maps/..." required></label>
    <button class="btn">Создать</button>
  </form>
</details>
{{end}}
