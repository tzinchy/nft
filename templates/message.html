{{define "content"}}
<div class="mx-auto grid min-h-[calc(100dvh-8rem)] max-w-md place-content-center justify-items-center gap-5 px-4 text-center">
  <span class="ripple relative grid size-24 place-items-center">
    <span class="absolute inset-0 rounded-full border-2 border-primary/40"></span>
    <span class="relative grid size-14 place-items-center rounded-full bg-primary text-primary-foreground [&>svg]:size-7">{{template "i-nfc"}}</span>
  </span>
  <h1 class="font-display text-2xl font-semibold">{{.Title}}</h1>
</div>
{{end}}
