{{define "content"}}
<div class="flex flex-col gap-6">
  <div class="flex flex-col gap-2">
    {{template "crumbs" (list (dict "href" "/cabinet/" "label" "Обзор") (dict "label" .V.LocationName) (dict "label" .V.T.Name))}}
    <div class="flex flex-wrap items-center gap-3">
      <h1 class="page-title">{{.V.T.Name}}</h1>
      {{if .V.T.Active}}<span class="badge-ok">Работает</span>{{else}}<span class="badge-bad">Отключена</span>{{end}}
    </div>
    <p class="flex min-w-0 items-center gap-1.5 text-sm text-muted-foreground [&>svg]:size-4 [&>svg]:shrink-0">{{template "i-link"}}<span class="truncate">Ведёт на {{.V.T.URL}}</span></p>
  </div>
  {{template "stats" .S}}
</div>
{{end}}
