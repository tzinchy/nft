{{define "content"}}
<h1 class="mb-4 text-2xl font-bold">Предприятия</h1>
<div class="space-y-3">
{{range .Businesses}}
  <a href="{{$.P}}/b/{{.ID}}" class="card card-link group">
    <div class="min-w-0">
      <div class="flex flex-wrap items-center gap-2"><span class="truncate font-semibold">{{.Name}}</span><span class="{{.Status.Class}}">{{.Status.Label}}</span></div>
      <p class="mt-1 text-sm text-zinc-500 dark:text-zinc-400">Точек: {{.Locations}} · меток: {{.Tags}} · до {{date .ExpiresAt}}</p>
    </div>
    <span class="text-2xl text-zinc-400 group-hover:text-blue-500">›</span>
  </a>
{{else}}
  <p class="card text-zinc-500 dark:text-zinc-400">Пока пусто — добавьте первое предприятие.</p>
{{end}}
</div>
<details class="add">
  <summary>+ Добавить предприятие</summary>
  <form method="post" action="{{.P}}/businesses" class="space-y-4 px-4 pb-4">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label class="label">Название<input class="input" name="name" required></label>
    <label class="label">Тариф<input class="input" name="plan" value="Годовое обслуживание"></label>
    <div class="grid grid-cols-2 gap-3">
      <label class="label">Цена в год, ₽<input class="input" type="number" min="1" name="price" value="1499" required></label>
      <label class="label">Действует до<input class="input" type="date" name="expires_at" value="{{.DefaultExp}}" required></label>
    </div>
    <button class="btn">Создать</button>
  </form>
</details>
{{template "telegram" .}}
{{end}}
