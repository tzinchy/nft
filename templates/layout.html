{{define "layout"}}<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}} · NFC Control</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="min-h-screen bg-zinc-100 text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
{{if .User}}
<div class="px-3 pt-3">
  <header class="mx-auto flex max-w-xl items-center justify-between rounded-2xl bg-white py-2 pr-2 pl-4 shadow-sm ring-1 ring-zinc-200 dark:bg-zinc-900 dark:ring-zinc-800">
    <a href="{{.Home}}" class="flex items-center gap-2 font-bold">
      <svg class="size-5 text-orange-500" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      NFC Control
    </a>
    <form method="post" action="{{.Home}}logout" class="flex items-center gap-2">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <span class="hidden text-sm text-zinc-500 sm:inline">{{.User}}</span>
      <button class="btn-ghost">Выйти</button>
    </form>
  </header>
</div>
{{end}}
<main class="mx-auto max-w-xl px-4 pt-4 pb-20">
{{if .Error}}<p class="mb-4 rounded-xl bg-red-100 px-4 py-3 text-red-800 dark:bg-red-500/15 dark:text-red-300">{{.Error}}</p>{{end}}
{{if .Notice}}<p class="mb-4 rounded-xl bg-green-100 px-4 py-3 text-green-800 dark:bg-green-500/15 dark:text-green-300">{{.Notice}}</p>{{end}}
{{template "content" .}}
</main>
<script>
document.querySelectorAll("[data-copy]").forEach(function (b) {
  b.addEventListener("click", function () {
    navigator.clipboard.writeText(b.dataset.copy).then(function () { b.querySelector("[data-hint]").textContent = "скопировано ✓"; });
  });
});
</script>
</body>
</html>{{end}}
