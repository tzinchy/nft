name: nfc-control

services:
  app:
    image: nfc-control-app
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      PANEL_PATH: ${PANEL_PATH:-/panel}
      CONTACT_URL: ${CONTACT_URL:-}
      LEGAL_NAME: ${LEGAL_NAME:-}
      LEGAL_INN: ${LEGAL_INN:-}
      LEGAL_OGRN: ${LEGAL_OGRN:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      LEGAL_EMAIL: ${LEGAL_EMAIL:-}
      LEGAL_PHONE: ${LEGAL_PHONE:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_RECEIPT: ${YOOKASSA_RECEIPT:-0}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API: ${TELEGRAM_API:-https://api.telegram.org}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    ports:
      - "127.0.0.1:8080:8080" # наружу только через Caddy
    volumes:
      - data:/data

  # HTTPS для прода: docker compose --profile prod up -d
  caddy:
    image: caddy:2-alpine
    profiles: [prod]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [app]

volumes:
  data:
  caddy:
